upstream backend {
    server backend:8000;
}

server {
    listen 80 default_server;
    server_name lbreslav.com www.lbreslav.com;

    # продление сертификата ходит по http, поэтому редирект стоит после
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name lbreslav.com www.lbreslav.com;

    client_max_body_size 10m;

    ssl_certificate     /etc/letsencrypt/live/lbreslav.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lbreslav.com/privkey.pem;

    # параметры заданы явно: certbot с certonly не создаёт
    # options-ssl-nginx.conf, на который обычно ссылаются примеры
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location / {
        root /var/www/frontend;
        try_files $uri /index.html;
    }

    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 30d;
    }

    location /api/ {
        proxy_pass http://backend;
        include /etc/nginx/proxy_params.conf;
    }

    location /admin/ {
        proxy_pass http://backend;
        include /etc/nginx/proxy_params.conf;
    }
}
