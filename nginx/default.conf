upstream backend {
    server backend:8000;
}

server {
    # default_server — чтобы конфиг отвечал и на http://localhost при
    # локальной проверке, а не только на боевые имена
    listen 80 default_server;
    server_name lbreslav.com www.lbreslav.com;

    client_max_body_size 10m;

    # собранный React
    location / {
        root /var/www/frontend;
        try_files $uri /index.html;
    }

    # статика Django: админка и DRF
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 30d;
    }

    location /api/ {
        proxy_pass http://backend;
        include /etc/nginx/proxy_params.conf;
    }

    location /admin/ {
        proxy_pass http://backend;
        include /etc/nginx/proxy_params.conf;
    }
}

