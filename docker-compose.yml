services:
  db:
    image: postgres:16-alpine
    environment:
      # значения по умолчанию — те же, что в settings.py: подстановка
      # ${...} читает корневой .env, а его может и не быть
      POSTGRES_DB: ${POSTGRES_DB:-lessons}
      POSTGRES_USER: ${POSTGRES_USER:-lessons}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lessons}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ — разворачивает шелл контейнера, а не compose (как в prod-файле)
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      # node_modules живут в томе: сборка под alpine, а не под хостовой WSL2
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  node_modules:
