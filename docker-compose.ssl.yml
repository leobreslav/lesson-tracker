# Оверлей, включающий HTTPS. Применяется поверх основного файла:
#   docker compose -f docker-compose.prod.yml -f docker-compose.ssl.yml up -d
# deploy.sh подставляет его сам, если в .env.prod стоит NGINX_SSL=true.
#
# Отдельный файл вместо правки nginx/default.conf на сервере: default.conf
# лежит в git, и ручная правка ломала бы git pull в deploy.sh.
name: lesson-tracker-prod

services:
  nginx:
    volumes:
      # тот же mount point, что и в основном файле, — конфиг подменяется
      - ./nginx/ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - frontend_dist:/var/www/frontend:ro
      - static_files:/var/www/static:ro
      - ./certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
