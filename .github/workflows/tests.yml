# Проверка на GitHub: те же два набора и теми же командами, что на машине, —
# питоновский и узловой, плюс секундные сторожа скриптов.
#
# Главное решение тут одно и то же, что в облачных сессиях: **CI гоняет
# docker compose**, а не собирает рядом «нативную» установку. Второй способ
# запустить те же тесты однажды разошёлся бы с первым, и узнали бы мы об
# этом по зелёному CI при красном ноутбуке.
#
# Отсюда же бесплатная выгода: раннер начинает с чистого клона без единого
# ключа — то есть ровно с того, с чего начинается облачная сессия. Поломку
# «сторож пустоты падает без ключей R2» такой прогон нашёл бы сам.
#
# Оба задания идут на каждый пуш любой ветки, и они же — дверь перед продом:
# `production` двигают только на коммит, у которого `python` и `node` здесь
# зелёные. Браузерных тестов в проекте нет с 25 сентября 2026.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  # новый пуш отменяет прошлый прогон той же ветки; ручной запуск в эту
  # группу не попадает
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # тот же скрипт, что зовёт хук сессии: без `.env` compose не поднимет
      # ничего — `env_file` объявлен, а DEBUG в settings.py без умолчания
      - name: Файл окружения
        run: bash scripts/dev-env.sh

      - name: Сторож трат в Anthropic
        # Секунда, и без контейнера: scripts/ никуда не примонтирован.
        # Регулярка портится молча в обе стороны — и переставая ловить, и
        # начиная ловить лишнее.
        run: python3 scripts/test-guard-anthropic-spend.py

      - name: Сторож автовыкатки прода
        # Секунда, и без контейнера. Скрипт выкатывает прод без человека, и
        # проверяются обе стороны: и что выкатывает, и что отказывается.
        run: bash scripts/test-prod-autodeploy.sh

      - name: Сторож переноса веток
        # gh подменён заглушкой, сети не надо. Большинство проверок — про
        # отказ: этим скриптом двигают ветку, которую тянет боевой сервер.
        run: bash scripts/test-ship.sh

      - name: Сторож замка на дверь контура
        # Секунда, и без контейнера. Замок решает, можно ли открывать контур
        # выкаткой; ошибка в любую сторону — либо открытая дев-дверь, либо
        # переставший выкатываться прод.
        run: bash scripts/test-check-login-door.sh

      - name: Питоновский набор
        run: docker compose run --rm -T backend python manage.py test

  node:
    name: node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Файл окружения
        run: bash scripts/dev-env.sh

      # тесты клиентской логики — встроенным в node раннером; словарь ошибок
      # они читают из backend/config/errors.py, и compose монтирует его сам
      - name: Узловые тесты
        run: docker compose run --rm -T frontend npm test

